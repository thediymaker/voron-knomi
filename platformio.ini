; KNOMI-NG: alternative firmware for the BTT KNOMI V2.
; partitions.csv is the stock layout, so the stock web updater can install this
; build and the stock firmware stays in the other OTA slot.

[platformio]
default_envs = knomiv2
boards_dir   = boards

[env:knomiv2]
platform    = espressif32 @ 6.9.0
board       = knomi2
framework   = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
build_src_filter = +<*> +<../ui/>
build_flags =
    -std=gnu++17
    -Iinclude
    -Iui
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=0
build_unflags = -std=gnu++11
lib_deps =
    lvgl/lvgl @ 9.2.2
    lovyan03/LovyanGFX @ 1.2.7
    bblanchon/ArduinoJson @ 7.4.2
    links2004/WebSockets @ 2.6.1
